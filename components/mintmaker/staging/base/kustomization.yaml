apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- ../../base
- ../../base/external-secrets
- ../blackbox
- plrs-resource-quota.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=99ddb8ad7dd52528c5389ab5048ba5647bc7fbf5
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=99ddb8ad7dd52528c5389ab5048ba5647bc7fbf5

namespace: mintmaker

images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: 99ddb8ad7dd52528c5389ab5048ba5647bc7fbf5
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: 654e74fcfb43aaff27b14606875447fd9ef55b40
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configMapGenerator:
  - name: controller-config
    files:
    - config.json

patches:
  - path: manager-mount-config-patch.yaml
  - path: manager-set-resources-patch.yaml
  - path: manager-enable-pprof-patch.yaml

configurations:
- kustomizeconfig.yaml

components:
  - ../../components/rh-certs
