apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- ../../base
- ../../base/external-secrets
- ../blackbox
- plrs-resource-quota.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=2ee0ec30dfd2353a5fc6104a31e58eb16957d5cc
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=2ee0ec30dfd2353a5fc6104a31e58eb16957d5cc

namespace: mintmaker

images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: 2ee0ec30dfd2353a5fc6104a31e58eb16957d5cc
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: 8640a1de799a6edebe387cb4a1e22135e5459bf2
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configMapGenerator:
  - name: controller-config
    files:
    - config.json

patches:
  - path: manager-mount-config-patch.yaml
  - path: manager-set-resources-patch.yaml
  - path: manager-enable-pprof-patch.yaml

configurations:
- kustomizeconfig.yaml

components:
  - ../../components/rh-certs
