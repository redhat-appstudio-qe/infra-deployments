apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- ../../base
- ../../base/external-secrets
- ../blackbox
- plrs-resource-quota.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=17d6306055488eb5e47e63e898fad05f8a2d63a0
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=17d6306055488eb5e47e63e898fad05f8a2d63a0

namespace: mintmaker

images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: 17d6306055488eb5e47e63e898fad05f8a2d63a0
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: 78decd73a14b8bf0ef057ecd9fd434e7582712a5
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configMapGenerator:
  - name: controller-config
    files:
    - config.json

patches:
  - path: manager-mount-config-patch.yaml
  - path: manager-set-resources-patch.yaml
  - path: manager-enable-pprof-patch.yaml

configurations:
- kustomizeconfig.yaml

components:
  - ../../components/rh-certs
