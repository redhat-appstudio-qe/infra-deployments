apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- ../../base/logging-operator-prerequisite
- ./logs-writer-rbac.yaml
patches:
# Applying these patches by cluster as Loki will not be deployed on ROKS staging
# clusters yet
- path: ./configure-logforwarder-output-loki-patch.yaml
  target:
    group: observability.openshift.io
    version: v1
    kind: ClusterLogForwarder
    name: instance
