apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - https://github.com/konflux-ci/release-service/config/default?ref=3195ea2052623fc0c319e1e1a2f99a743e8b0e0b
  - release_service_config.yaml

images:
  - name: quay.io/konflux-ci/release-service
    newName: quay.io/konflux-ci/release-service
    newTag: 3195ea2052623fc0c319e1e1a2f99a743e8b0e0b

namespace: release-service

components:
  - ../k-components/rh-certs

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: release-service-controller-manager
    path: manager-memory-patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: release-pipeline-resource-role
    path: ibm-public-key-patch.yaml
