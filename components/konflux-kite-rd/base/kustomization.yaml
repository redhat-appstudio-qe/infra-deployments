---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - konflux-kite-ns.yaml
  - rbac
  - konflux-kite-deploy.yaml
  - konflux-kite-svc.yaml
  - konflux-kite-api-route.yaml
  - konflux-kite-hpa.yaml

# cert-manager/ and external-secrets/ live here as the single source of
# truth, but are intentionally NOT referenced above: Kargo's manifest-wh
# promotion copies this whole base/ directory into every ring's
# base-snapshot/ regardless of what this file's resources: list includes,
# so each ring's own kustomization.yaml opts in by referencing
# base-snapshot/cert-manager and/or base-snapshot/external-secrets
# directly (see rings/ring-0/base and rings/ring-1/base). This keeps every
# ring's copy in sync automatically when files change here, without
# maintaining per-ring delete patches. Same pattern as mintmaker-rd.

namespace: konflux-kite

configMapGenerator:
  - name: kite-config
    namespace: konflux-kite
    literals:
      - KITE_PROJECT_ENV=production
      - KITE_HOST=0.0.0.0
      - KITE_PORT=8443
      - KITE_DB_SSL_MODE=require
      - KITE_LOG_LEVEL=info
      - KITE_LOG_FORMAT=json
      - KITE_ENABLE_CORS=true
      - KITE_FEATURE_NAMESPACE_CHECKING=true
      - KITE_FEATURE_WEBHOOKS=true
      - KITE_FEATURE_METRICS=true
      - KITE_READ_TIMEOUT=30s
      - KITE_WRITE_TIMEOUT=30s
      - KITE_IDLE_TIMEOUT=60s
      - KITE_SHUTDOWN_TIMEOUT=10s
      - AUTH_IMPERSONATE=true
