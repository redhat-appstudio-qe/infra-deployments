apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- base-snapshot
- oauth
- https://github.com/konflux-ci/image-rbac-proxy/deploy/development/base?ref=a5ed45a171cdd7df17aa8553758eb8e3c733ddc0
images:
- name: memcached
  newName: quay.io/kubearchive/memcached
  newTag: 1.6.39
- name: quay.io/konflux-ci/image-rbac-proxy
  newName: quay.io/konflux-ci/image-rbac-proxy
  newTag: a5ed45a171cdd7df17aa8553758eb8e3c733ddc0
vars:
- name: DEX_DEPLOYMENT_NAME
  objref:
    apiVersion: apps/v1
    kind: Deployment
    name: dex
  fieldref:
    fieldpath: metadata.name
configurations:
- role-var-reference.yaml
