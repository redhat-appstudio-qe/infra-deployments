apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- ../base/kueue
- buildah-roks-seccomp-cp.yaml
- buildah-roks-scc.yaml
- buildah-roks-scc-clusterrole.yaml
- buildah-roks-scc-clusterrolebinding.yaml

patches:
  - target:
      group: policies.kyverno.io
      version: v1
      kind: NamespacedMutatingPolicy
      name: inject-repository-cluster-param
    patch: |-
      - op: replace
        path: /spec/variables/0/expression
        value: '"lightwell-dev"'

