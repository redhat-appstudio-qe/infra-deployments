---
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: inject-repository-cluster-param
spec:
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["pipelinesascode.tekton.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["repositories"]
  variables:
    - name: clusterName
      expression: '"__CLUSTER_NAME__"'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          object.spec.params.filter(p, p.name == "cluster")[0].value != variables.clusterName ?
          [
            JSONPatch{
              op: "replace",
              path: "/spec/params/" + string(object.spec.params.map(p, p.name).indexOf("cluster")) + "/value",
              value: variables.clusterName
            }
          ]
