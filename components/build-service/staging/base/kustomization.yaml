apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../base/external-secrets
- https://github.com/konflux-ci/build-service/config/default?ref=7e1a8b2cf9c580a3f3a111c75be36cd739166d5a

namespace: build-service

images:
- name: quay.io/konflux-ci/build-service
