  newTag: 7e1a8b2cf9c580a3f3a111c75be36cd739166d5a

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

components:
  - ../../components/rh-certs

patches:
  - path: manager_resources_patch.yaml
