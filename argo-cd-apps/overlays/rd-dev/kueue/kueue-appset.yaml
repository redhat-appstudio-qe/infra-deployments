apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kueue
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    appstudio.redhat.com/deployment-clusters: "tenant"
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters: # Ensures all clusters are selected (only in dev)
              values:
                sourceRoot: components/kueue-rd
                ring: "ring-0"
                clusterDir: "base"

  template:
    metadata:
      name: kueue-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        server: '{{server}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
