apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: authentication
  labels: # Helps k-components detect this appset to apply the correct patches
    appstudio.redhat.com/deployment-clusters: "all"
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/authentication
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via k-components (or manually if the cluster list is unusual)

  template:
    metadata:
      name: authentication-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: authentication
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
