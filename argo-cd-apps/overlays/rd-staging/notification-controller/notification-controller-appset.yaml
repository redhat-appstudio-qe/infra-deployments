apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: notification-controller
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchExpressions: # Ensures that no clusters are selected; clusters are specified explicitly below
                  - key: appstudio.redhat.com/select-none
                    operator: Exists
                  - key: appstudio.redhat.com/select-none
                    operator: DoesNotExist
              values:
                sourceRoot: components/notification-controller-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements:
                - values.ring: ring-1
                  nameNormalized: stone-stage-p01
                  values.clusterDir: stone-stage-p01
                - values.ring: ring-1
                  nameNormalized: stone-stg-rh01
                  values.clusterDir: stone-stg-rh01

  template:
    metadata:
      name: notification-controller-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: notification-controller
        server: '{{server}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
